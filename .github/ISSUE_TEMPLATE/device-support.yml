name: Device support
description: Ask for another Soundcore model to be supported
labels: [device-support]
body:
  - type: input
    id: model
    attributes:
      label: Which headphones?
      placeholder: e.g. Soundcore Space One Pro
    validations: {required: true}
  - type: textarea
    id: status
    attributes:
      label: Device support report
      description: Copy using the clipboard button beside Quit in the app, or quit the app and run `soundcorectl support-report`. The report excludes Bluetooth names, addresses, raw packets, and logs. Review before sharing.
      render: text
  - type: checkboxes
    id: help
    attributes:
      label: Can you help test?
      options:
        - label: I have this device and can run captures against it
